{% extends 'base.html' %}

{% block content %}
<div class="kanban-calendar" id="kanbanCalendarRoot">
    <div class="kanban-toolbar">
        <div class="kanban-nav">
            <button class="btn-icon" onclick="kanbanCalendar.prev()" id="kanbanPrevBtn" title="Назад">
                <i class="ri-arrow-left-s-line"></i>
            </button>
            <h2 class="kanban-month-title" id="kanbanTitle">Загрузка...</h2>
            <button class="btn-icon" onclick="kanbanCalendar.next()" id="kanbanNextBtn" title="Вперёд">
                <i class="ri-arrow-right-s-line"></i>
            </button>
        </div>
        <div class="kanban-actions">
            <div class="kanban-view-switch">
                <button class="btn btn-ghost btn-sm" id="kanbanViewMonthBtn" onclick="kanbanCalendar.setViewMode('month')">
                    <i class="ri-calendar-2-line"></i> Месяц
                </button>
                <button class="btn btn-ghost btn-sm" id="kanbanViewWeekBtn" onclick="kanbanCalendar.setViewMode('week')">
                    <i class="ri-calendar-event-line"></i> Неделя
                </button>
            </div>
            <button class="btn btn-ghost btn-sm" onclick="kanbanCalendar.goToToday()">
                <i class="ri-focus-3-line"></i> Сегодня
            </button>
            <span class="kanban-actions-group" id="kanbanExpandActions">
                <button class="btn btn-ghost btn-sm" onclick="kanbanCalendar.expandAll()">
                    <i class="ri-expand-up-down-line"></i> Раскрыть все
                </button>
                <button class="btn btn-ghost btn-sm" onclick="kanbanCalendar.collapseAll()">
                    <i class="ri-collapse-diagonal-line"></i> Свернуть
                </button>
            </span>
        </div>
    </div>

    <div class="kanban-weeks" id="kanbanWeeks">
        <div class="kanban-loading">
            <i class="ri-loader-4-line spin"></i>
            <p>Загрузка задач...</p>
        </div>
    </div>
</div>
<script>
(function () {
    window.__kanbanMountGen = (window.__kanbanMountGen || 0) + 1;

class KanbanCalendar {
    constructor() {
        this._mountGen = window.__kanbanMountGen;
        this.currentDate = new Date();
        // 'month' — весь месяц неделями-аккордеонами, 'week' — только одна неделя, крупно
        this.viewMode = (() => {
            try {
                return localStorage.getItem('scopeCalendarView') === 'week' ? 'week' : 'month';
            } catch (e) {
                return 'month';
            }
        })();
        this.events = [];
        this.expandedWeeks = new Set();
        this.draggedTask = null;
        void this.init('instant');
    }

    isStale() {
        return this._mountGen !== window.__kanbanMountGen;
    }

    formatDateStr(y, m, d) {
        return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }

    getTodayStr() {
        const t = new Date();
        return this.formatDateStr(t.getFullYear(), t.getMonth(), t.getDate());
    }

    /**
     * @param {'instant'|'smooth'|undefined} scrollToday — после render прокрутить к ячейке «сегодня»
     */
    async init(scrollToday) {
        await this.loadEvents();
        if (this.isStale()) return;
        this.render();
        if (this.isStale()) return;
        if (scrollToday === 'instant' || scrollToday === 'smooth') {
            this.scheduleScrollToToday(scrollToday === 'smooth');
        }
    }

    scheduleScrollToToday(smooth) {
        const g = this._mountGen;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (g !== window.__kanbanMountGen) return;
                this.scrollToTodayCell(smooth);
            });
        });
    }

    scrollToTodayCell(smooth) {
        if (this.isStale()) return;
        const el = document.querySelector('#kanbanWeeks .cal-cell.today');
        if (!el) return;
        el.scrollIntoView({
            behavior: smooth ? 'smooth' : 'instant',
            block: 'center',
            inline: 'nearest',
        });
    }

    async loadEvents() {
        if (this.viewMode === 'week') {
            const ws = this.weekStart(this.currentDate);
            const we = new Date(ws);
            we.setDate(we.getDate() + 6);
            await this.fetchEvents(
                this.formatDateStr(ws.getFullYear(), ws.getMonth(), ws.getDate()),
                this.formatDateStr(we.getFullYear(), we.getMonth(), we.getDate()),
            );
            return;
        }

        const y = this.currentDate.getFullYear();
        const m = this.currentDate.getMonth();
        const firstDay = new Date(y, m, 1);
        let startDay = firstDay.getDay();
        startDay = startDay === 0 ? 6 : startDay - 1;
        const calStart = new Date(y, m, 1 - startDay);
        const lastDay = new Date(y, m + 1, 0);
        const totalDays = startDay + lastDay.getDate();
        const rows = Math.ceil(totalDays / 7);
        const calEnd = new Date(calStart);
        calEnd.setDate(calEnd.getDate() + rows * 7 - 1);

        await this.fetchEvents(
            this.formatDateStr(calStart.getFullYear(), calStart.getMonth(), calStart.getDate()),
            this.formatDateStr(calEnd.getFullYear(), calEnd.getMonth(), calEnd.getDate()),
        );
    }

    async fetchEvents(start, end) {
        try {
            const res = await fetch(`/api/kanban-events/?start=${start}&end=${end}`);
            if (this.isStale()) return;
            this.events = await res.json();
            this.events.forEach(e => { if (e.order == null) e.order = 0; });
        } catch (e) {
            if (!this.isStale()) this.events = [];
        }
    }

    /** Понедельник недели, в которую попадает дата. */
    weekStart(date) {
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const shift = d.getDay() === 0 ? 6 : d.getDay() - 1;
        d.setDate(d.getDate() - shift);
        return d;
    }

    getWeeks() {
        if (this.viewMode === 'week') {
            const cursor = this.weekStart(this.currentDate);
            const m = this.currentDate.getMonth();
            const days = [];
            for (let d = 0; d < 7; d++) {
                days.push({
                    date: new Date(cursor),
                    dateStr: this.formatDateStr(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()),
                    isCurrentMonth: cursor.getMonth() === m,
                    isToday: this.formatDateStr(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()) === this.getTodayStr(),
                });
                cursor.setDate(cursor.getDate() + 1);
            }
            return [{ index: 0, days, startStr: days[0].dateStr, endStr: days[6].dateStr }];
        }

        const y = this.currentDate.getFullYear();
        const m = this.currentDate.getMonth();
        const firstDay = new Date(y, m, 1);
        const lastDay = new Date(y, m + 1, 0);

        let startDay = firstDay.getDay();
        startDay = startDay === 0 ? 6 : startDay - 1;

        const calStart = new Date(y, m, 1 - startDay);
        const totalDays = startDay + lastDay.getDate();
        const rows = Math.ceil(totalDays / 7);

        const weeks = [];
        const cursor = new Date(calStart);

        for (let w = 0; w < rows; w++) {
            const days = [];
            for (let d = 0; d < 7; d++) {
                days.push({
                    date: new Date(cursor),
                    dateStr: this.formatDateStr(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()),
                    isCurrentMonth: cursor.getMonth() === m,
                    isToday: this.formatDateStr(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()) === this.getTodayStr(),
                });
                cursor.setDate(cursor.getDate() + 1);
            }
            weeks.push({
                index: w,
                days,
                startStr: days[0].dateStr,
                endStr: days[6].dateStr,
            });
        }
        return weeks;
    }

    render() {
        if (this.isStale()) return;
        const titleEl = document.getElementById('kanbanTitle');
        const container = document.getElementById('kanbanWeeks');
        if (!titleEl || !container) return;

        const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        const monthsGen = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
        const y = this.currentDate.getFullYear();
        const m = this.currentDate.getMonth();

        const weeks = this.getWeeks();

        if (this.viewMode === 'week') {
            const a = weeks[0].days[0].date;
            const b = weeks[0].days[6].date;
            const left = a.getMonth() === b.getMonth() ? `${a.getDate()}` : `${a.getDate()} ${monthsGen[a.getMonth()]}`;
            titleEl.textContent = `${left} — ${b.getDate()} ${monthsGen[b.getMonth()]} ${b.getFullYear()}`;
        } else {
            titleEl.textContent = `${months[m]} ${y}`;
        }

        this.syncViewChrome();
        const todayStr = this.getTodayStr();

        if (this.viewMode === 'week') {
            container.innerHTML = this.renderTimeline(weeks[0]);
            this.scrollTimelineToWork();
            return;
        }

        if (this.isStale()) return;
        container.innerHTML = this.renderMonthGrid(weeks, todayStr, m);
    }

    // ---------------------------------------------------------- месяц сеткой

    renderMonthGrid(weeks, todayStr, month) {
        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        let head = '';
        dayNames.forEach((name, i) => {
            head += `<div class="cal-head-cell ${i >= 5 ? 'weekend' : ''}">${name}</div>`;
        });

        let cells = '';
        weeks.forEach(week => {
            week.days.forEach((day, dIdx) => {
                const dayEvents = this.events
                    .filter(e => e.start === day.dateStr)
                    .sort((a, b) => {
                        const ac = a.completed ? 1 : 0;
                        const bc = b.completed ? 1 : 0;
                        if (ac !== bc) return ac - bc;
                        const at = a.time || '99:99';
                        const bt = b.time || '99:99';
                        if (at !== bt) return at < bt ? -1 : 1;
                        return a.id - b.id;
                    });

                const cls = [
                    'cal-cell',
                    day.isToday ? 'today' : '',
                    !day.isCurrentMonth ? 'other-month' : '',
                    day.dateStr < todayStr && !day.isToday ? 'past' : '',
                    dIdx >= 5 ? 'weekend' : '',
                ].filter(Boolean).join(' ');

                const shown = dayEvents.slice(0, 4);
                const rest = dayEvents.length - shown.length;

                let items = shown.map(task => this.renderMonthItem(task)).join('');
                items += dayEvents.slice(4).map(task => this.renderMonthItem(task, true)).join('');

                cells += `
                    <div class="${cls}" data-date="${day.dateStr}"
                         ondragover="kanbanCalendar.onDragOverDay(event)"
                         ondragleave="kanbanCalendar.onDragLeaveDay(event)"
                         ondrop="kanbanCalendar.onDropDay(event, '${day.dateStr}')">
                        <div class="cal-cell-head">
                            <span class="cal-num">${day.date.getDate()}</span>
                            <button type="button" class="cal-add" title="Новая задача"
                                    onclick="event.stopPropagation(); openTaskModal({due_date: '${day.dateStr}'})">
                                <i class="ri-add-line"></i>
                            </button>
                        </div>
                        <div class="cal-items">${items}</div>
                        ${rest > 0 ? `<button type="button" class="cal-more" onclick="kanbanCalendar.toggleCell(this)">ещё ${rest}</button>` : ''}
                    </div>`;
            });
        });

        return `<div class="cal"><div class="cal-head">${head}</div><div class="cal-grid">${cells}</div></div>`;
    }

    renderMonthItem(task, hidden = false) {
        return `
            <div class="cal-item ${task.completed ? 'completed' : ''} ${task.overdue ? 'overdue' : ''} ${hidden ? 'extra' : ''}"
                 style="--tl-accent:${this.priorityColor(task)}${this.projectTint(task, 0.08) ? `; background-image:linear-gradient(0deg, ${this.projectTint(task, 0.08)}, ${this.projectTint(task, 0.08)})` : ''}"
                 draggable="true"
                 data-task-id="${task.id}"
                 ondragstart="kanbanCalendar.onDragStart(event, ${task.id})"
                 ondragend="kanbanCalendar.onDragEnd(event)"
                 title="${this.escapeHtml(task.title).replace(/"/g, '&quot;')}"
                 onclick="openTaskEditor(${task.id})">
                ${task.time ? `<span class="cal-item-time">${task.time}</span>` : ''}
                <span class="cal-item-title">${this.escapeHtml(this.shortTitle(task.title))}</span>
                ${task.project ? `<span class="cal-item-dot" style="background:${task.projectColor || 'var(--accent-secondary)'}" title="${this.escapeHtml(task.project)}"></span>` : ''}
            </div>`;
    }

    /** «ещё N» раскрывает день целиком. */
    toggleCell(btn) {
        const cell = btn.closest('.cal-cell');
        if (!cell) return;
        cell.classList.toggle('expanded');
        btn.textContent = cell.classList.contains('expanded')
            ? 'свернуть'
            : `ещё ${cell.querySelectorAll('.cal-item.extra').length}`;
    }

    renderDropSlot(dateStr, beforeId, isEmpty) {
        const cls = isEmpty ? 'kanban-drop-slot kanban-drop-slot--empty' : 'kanban-drop-slot';
        const bid = beforeId === '' ? '' : this.escapeHtml(beforeId);
        return `
            <div class="${cls}" data-date="${dateStr}" data-before-id="${bid}"
                 ondragover="kanbanCalendar.onSlotDragOver(event)"
                 ondragleave="kanbanCalendar.onSlotDragLeave(event)"
                 ondrop="kanbanCalendar.onSlotDrop(event)"></div>`;
    }

    // ---------------------------------------------------------- таймлайн недели

    /** Показать сначала рабочие часы: к первому событию недели или к 8 утра. */
    scrollTimelineToWork() {
        const body = document.querySelector('.tl-body');
        if (!body) return;
        const firstEvent = body.querySelector('.tl-event');
        const offset = firstEvent ? Math.max(0, parseFloat(firstEvent.style.top) - 40) : 0;
        body.scrollTop = offset;
    }

    /** Минуты от полуночи, если у задачи есть время. */
    eventStartMinutes(task) {
        if (!task.time) return null;
        const [h, m] = String(task.time).split(':').map(Number);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;
        return h * 60 + m;
    }

    /** Длительность задачи: своя, если задана; пара — 1:30; иначе час. */
    eventDuration(task) {
        if (task.duration) return Math.max(15, Number(task.duration));
        const tags = task.tags || [];
        return tags.some(t => (t.name || '').toLowerCase() === 'пары') ? 90 : 60;
    }

    /** Ширину делят только реально пересекающиеся события — соседние по времени не жмутся. */
    layoutDay(events) {
        const sorted = events.slice().sort((a, b) => a._start - b._start);

        let cluster = [];
        let clusterEnd = -1;
        let columns = [];

        const closeCluster = () => {
            const cols = Math.max(1, columns.length);
            cluster.forEach(ev => { ev._cols = cols; });
            cluster = [];
            columns = [];
            clusterEnd = -1;
        };

        sorted.forEach(ev => {
            if (cluster.length && ev._start >= clusterEnd) closeCluster();

            let placed = false;
            for (let i = 0; i < columns.length; i++) {
                const last = columns[i][columns[i].length - 1];
                if (last._end <= ev._start) {
                    columns[i].push(ev);
                    ev._col = i;
                    placed = true;
                    break;
                }
            }
            if (!placed) {
                ev._col = columns.length;
                columns.push([ev]);
            }

            cluster.push(ev);
            clusterEnd = Math.max(clusterEnd, ev._end);
        });
        closeCluster();

        return sorted;
    }

    renderTimeline(week) {
        const dayNames = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
        const todayStr = this.getTodayStr();
        const HOUR_PX = 64;

        const byDay = week.days.map(day => {
            const all = this.events.filter(e => e.start === day.dateStr);
            const timed = [];
            const untimed = [];
            all.forEach(e => {
                const start = this.eventStartMinutes(e);
                if (start === null) {
                    untimed.push(e);
                } else {
                    e._start = start;
                    e._end = start + this.eventDuration(e);
                    timed.push(e);
                }
            });
            return { day, timed: this.layoutDay(timed), untimed };
        });

        // Сутки показываем с 6 утра до полуночи; выходит событие за рамки — расширим.
        let first = 6 * 60;
        let last = 24 * 60;
        byDay.forEach(({ timed }) => timed.forEach(e => {
            first = Math.min(first, e._start);
            last = Math.max(last, e._end);
        }));
        const startHour = Math.floor(first / 60);
        const endHour = Math.ceil(last / 60);
        const hours = [];
        for (let h = startHour; h <= endHour; h++) hours.push(h);
        const gridHeight = (endHour - startHour) * HOUR_PX;
        this._tl = { startHour, endHour, hourPx: HOUR_PX };
        const topOf = minutes => ((minutes - startHour * 60) / 60) * HOUR_PX;

        const hasAllDay = byDay.some(d => d.untimed.length > 0);

        let head = '<div class="tl-corner"></div>';
        byDay.forEach(({ day }, idx) => {
            const cls = [
                'tl-day-head',
                day.isToday ? 'today' : '',
                idx >= 5 ? 'weekend' : '',
                day.dateStr < todayStr && !day.isToday ? 'past' : '',
            ].filter(Boolean).join(' ');
            head += `
                <div class="${cls}">
                    <span class="tl-day-name">${dayNames[idx]}</span>
                    <span class="tl-day-num">${day.date.getDate()}</span>
                </div>`;
        });

        let allday = '';
        if (hasAllDay) {
            allday = '<div class="tl-allday"><div class="tl-allday-label">без времени</div>';
            byDay.forEach(({ day, untimed }, idx) => {
                allday += `<div class="tl-allday-col ${idx >= 5 ? 'weekend' : ''}" data-date="${day.dateStr}">`;
                untimed.forEach(task => { allday += this.renderTimelineChip(task); });
                allday += '</div>';
            });
            allday += '</div>';
        }

        let axis = '';
        hours.forEach((h, i) => {
            if (i === hours.length - 1) return;
            const dim = h < 9 || h >= 22 ? ' dim' : '';
            axis += `<div class="tl-hour${dim}" style="height:${HOUR_PX}px"><span>${String(h).padStart(2, '0')}:00</span></div>`;
        });

        let grid = '';
        byDay.forEach(({ day, timed }, idx) => {
            const cls = [
                'tl-col',
                day.isToday ? 'today' : '',
                idx >= 5 ? 'weekend' : '',
                day.dateStr < todayStr && !day.isToday ? 'past' : '',
            ].filter(Boolean).join(' ');

            let cells = '';
            hours.forEach((h, i) => {
                if (i === hours.length - 1) return;
                // Раннее утро и поздний вечер — приглушены: учёба туда не попадает.
                const dim = h < 9 || h >= 22 ? ' dim' : '';
                cells += `<div class="tl-slot${dim}" style="height:${HOUR_PX}px"
                               onclick="openTaskModal({due_date: '${day.dateStr}', due_time: '${String(h).padStart(2, '0')}:00'})"
                               title="Новая задача в ${String(h).padStart(2, '0')}:00"></div>`;
            });

            let blocks = '';
            timed.forEach(task => {
                const top = topOf(task._start);
                const height = Math.max(34, ((task._end - task._start) / 60) * HOUR_PX - 3);
                const width = 100 / task._cols;
                blocks += this.renderTimelineEvent(task, top, height, task._col * width, width);
            });

            let nowLine = '';
            if (day.isToday) {
                const now = new Date();
                const mins = now.getHours() * 60 + now.getMinutes();
                if (mins >= startHour * 60 && mins <= endHour * 60) {
                    nowLine = `<div class="tl-now" style="top:${topOf(mins)}px"></div>`;
                }
            }

            grid += `<div class="${cls}" style="height:${gridHeight}px" data-date="${day.dateStr}"
                          ondragover="kanbanCalendar.onTimelineDragOver(event)"
                          ondragleave="kanbanCalendar.onTimelineDragLeave(event)"
                          ondrop="kanbanCalendar.onTimelineDrop(event, '${day.dateStr}')">${cells}${blocks}${nowLine}</div>`;
        });

        return `
            <div class="tl">
                <div class="tl-head">${head}</div>
                ${allday}
                <div class="tl-body">
                    <div class="tl-axis">${axis}</div>
                    <div class="tl-grid">${grid}</div>
                </div>
            </div>`;
    }

    /** Чёрточка слева — всегда приоритет задачи. */
    priorityColor(task) {
        const colors = {
            low: 'var(--priority-low)',
            medium: 'var(--priority-medium)',
            high: 'var(--priority-high)',
            urgent: 'var(--priority-urgent)',
        };
        return colors[task.priority_class] || 'var(--priority-medium)';
    }

    /** Лёгкая заливка цветом проекта: карточки разных проектов различимы с одного взгляда. */
    projectTint(task, alpha) {
        const hex = String(task.projectColor || '').trim();
        const m = /^#?([0-9a-f]{6})$/i.exec(hex);
        if (!m) return '';
        const n = parseInt(m[1], 16);
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    /** 30 → «30 мин», 60 → «1 ч», 90 → «1:30». */
    formatDuration(minutes) {
        const m = Number(minutes) || 0;
        if (m <= 0) return '';
        if (m < 60) return `${m} мин`;
        if (m % 60 === 0) return `${m / 60} ч`;
        return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
    }

    /** Проект — точкой его цвета с подписью, отдельно от приоритета. */
    projectMark(task) {
        if (!task.project) return '';
        const color = task.projectColor || 'var(--accent-secondary)';
        return `<span class="tl-project"><span class="tl-project-dot" style="background:${color}"></span>${this.escapeHtml(task.project)}</span>`;
    }

    renderTimelineEvent(task, top, height, left, width) {
        const place = this.placeOf(task);
        // Ниже этого подвал с проектом уже не помещается — прячем его.
        const compact = height < 58 ? ' compact' : '';
        const duration = this.formatDuration(this.eventDuration(task));
        const tint = this.projectTint(task, 0.09);
        const foot = compact ? '' : `
                <div class="tl-event-foot">
                    ${this.projectMark(task)}
                    ${place ? `<span class="tl-event-place">${this.escapeHtml(place)}</span>` : ''}
                    ${duration ? `<span class="tl-event-dur">${duration}</span>` : ''}
                </div>`;
        // У пар в описании лежит преподаватель, у прочих задач — первая строка.
        const summary = task.summary && height >= 80
            ? `<div class="tl-event-summary">${this.escapeHtml(task.summary)}</div>`
            : '';
        return `
            <div class="tl-event ${task.completed ? 'completed' : ''} ${task.overdue ? 'overdue' : ''}${compact}"
                 style="top:${top}px; height:${height}px; left:calc(${left}% + 2px); width:calc(${width}% - 4px); --tl-accent:${this.priorityColor(task)}${tint ? `; background-image:linear-gradient(0deg, ${tint}, ${tint})` : ''}"
                 draggable="true"
                 ondragstart="kanbanCalendar.onTimelineDragStart(event, ${task.id})"
                 ondragend="kanbanCalendar.onTimelineDragEnd(event)"
                 data-task-id="${task.id}"
                 title="${this.escapeHtml(task.title).replace(/"/g, '&quot;')}"
                 onclick="openTaskEditor(${task.id})">
                <div class="tl-event-time">${task.time || ''}${task.repeat ? ' <i class="ri-repeat-2-line tl-repeat"></i>' : ''}</div>
                <div class="tl-event-title">${this.escapeHtml(this.shortTitle(task.title))}</div>
                ${summary}
                ${foot}
                <button class="tl-event-check" title="${task.completed ? 'Вернуть' : 'Завершить'}"
                        onclick="event.stopPropagation(); kanbanCalendar.toggleTaskFromKanban(${task.id})">
                    <i class="${task.completed ? 'ri-checkbox-circle-fill' : 'ri-checkbox-blank-circle-line'}"></i>
                </button>
            </div>`;
    }

    // --- перенос блоков по времени

    onTimelineDragStart(e, taskId) {
        this.draggedTask = taskId;
        const rect = e.currentTarget.getBoundingClientRect();
        // Держим блок за ту же точку, за которую взяли.
        this._grabOffsetMin = ((e.clientY - rect.top) / this._tl.hourPx) * 60;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(taskId));
        e.currentTarget.classList.add('dragging');
    }

    onTimelineDragEnd(e) {
        e.currentTarget.classList.remove('dragging');
        this.clearTimelineGhost();
    }

    clearTimelineGhost() {
        document.querySelectorAll('.tl-ghost').forEach(g => g.remove());
        document.querySelectorAll('.tl-col.drag-over').forEach(c => c.classList.remove('drag-over'));
    }

    /** Минуты от полуночи по позиции курсора в колонке, с шагом 5 минут. */
    timeFromPointer(e, col) {
        const rect = col.getBoundingClientRect();
        const raw = ((e.clientY - rect.top) / this._tl.hourPx) * 60 - (this._grabOffsetMin || 0);
        const minutes = this._tl.startHour * 60 + raw;
        const snapped = Math.round(minutes / 5) * 5;
        const min = this._tl.startHour * 60;
        const max = this._tl.endHour * 60 - 5;
        return Math.min(max, Math.max(min, snapped));
    }

    onTimelineDragOver(e) {
        if (this.draggedTask === null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const col = e.currentTarget;
        col.classList.add('drag-over');

        const minutes = this.timeFromPointer(e, col);
        const top = ((minutes - this._tl.startHour * 60) / 60) * this._tl.hourPx;
        let ghost = col.querySelector('.tl-ghost');
        if (!ghost) {
            document.querySelectorAll('.tl-ghost').forEach(g => g.remove());
            ghost = document.createElement('div');
            ghost.className = 'tl-ghost';
            col.appendChild(ghost);
        }
        ghost.style.top = `${top}px`;
        ghost.textContent = `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`;
    }

    onTimelineDragLeave(e) {
        const col = e.currentTarget;
        if (!col.contains(e.relatedTarget)) {
            col.classList.remove('drag-over');
            col.querySelectorAll('.tl-ghost').forEach(g => g.remove());
        }
    }

    async onTimelineDrop(e, dateStr) {
        e.preventDefault();
        const taskId = this.draggedTask;
        const col = e.currentTarget;
        const minutes = this.timeFromPointer(e, col);
        this.clearTimelineGhost();
        this.draggedTask = null;
        if (!taskId) return;

        const time = `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`;
        const body = new FormData();
        body.append('due_date', dateStr);
        body.append('due_time', time);
        body.append('csrfmiddlewaretoken', this.csrfToken());

        try {
            const res = await fetch(`/tasks/${taskId}/update-date/`, { method: 'POST', body });
            if (!res.ok) throw new Error('save failed');
        } catch (err) {
            console.error('Перенос не сохранился', err);
        }
        await this.reload();
    }

    csrfToken() {
        const el = document.querySelector('[name=csrfmiddlewaretoken]');
        return el ? el.value : '';
    }

    renderTimelineChip(task) {
        return `
            <div class="tl-chip ${task.completed ? 'completed' : ''}" style="--tl-accent:${this.priorityColor(task)}${this.projectTint(task, 0.09) ? `; background-image:linear-gradient(0deg, ${this.projectTint(task, 0.09)}, ${this.projectTint(task, 0.09)})` : ''}"
                 title="${this.escapeHtml(task.title).replace(/"/g, '&quot;')}"
                 onclick="openTaskEditor(${task.id})">
                <span class="tl-chip-title">${this.escapeHtml(this.shortTitle(task.title))}</span>
                ${this.projectMark(task)}
            </div>`;
    }

    /** «ITIL — лекция (И-204-в)» → «ITIL — лекция»: аудитория едет отдельной строкой. */
    shortTitle(title) {
        return String(title).replace(/\s*\([^)]*\)\s*$/, '').trim() || String(title);
    }

    placeOf(task) {
        const m = String(task.title).match(/\(([^)]*)\)\s*$/);
        return m ? m[1] : '';
    }

    renderTask(task, doneBlockStart) {
        const priorityColors = { low: 'var(--priority-low)', medium: 'var(--priority-medium)', high: 'var(--priority-high)', urgent: 'var(--priority-urgent)' };
        const color = priorityColors[task.priority_class] || 'var(--priority-medium)';
        const doneSep = doneBlockStart ? ' kanban-task-done-start' : '';

        return `
            <div class="kanban-task ${task.completed ? 'completed' : ''} ${task.overdue ? 'overdue' : ''}${doneSep}"
                 draggable="true"
                 data-task-id="${task.id}"
                 ondragstart="kanbanCalendar.onDragStart(event, ${task.id})"
                 ondragend="kanbanCalendar.onDragEnd(event)">
                <div class="kanban-task-priority" style="background:${color}"></div>
                <div class="kanban-task-body">
                    <button type="button" class="kanban-task-title" draggable="false" title="${this.escapeHtml(task.title).replace(/"/g, '&quot;')}" onclick="event.stopPropagation(); openTaskEditor(${task.id})">${this.escapeHtml(task.title)}</button>
                    <div class="kanban-task-meta">
                        ${task.time ? `<span><i class="ri-time-line"></i>${task.time}</span>` : ''}
                        ${task.project ? `<span style="color:${task.projectColor || 'var(--accent-secondary)'}">${this.escapeHtml(task.project)}</span>` : ''}
                    </div>
                </div>
                <button class="kanban-task-check" onclick="event.stopPropagation(); kanbanCalendar.toggleTaskFromKanban(${task.id})" title="${task.completed ? 'Вернуть' : 'Завершить'}">
                    <i class="${task.completed ? 'ri-checkbox-circle-fill' : 'ri-checkbox-blank-circle-line'}"></i>
                </button>
            </div>`;
    }

    // Drag and Drop
    onDragStart(e, taskId) {
        this.draggedTask = taskId;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(taskId));
        e.currentTarget.classList.add('dragging');
    }

    onDragEnd(e) {
        e.currentTarget.classList.remove('dragging');
        document.querySelectorAll('.kanban-day.drag-over').forEach(d => d.classList.remove('drag-over'));
        document.querySelectorAll('.kanban-drop-slot.drag-active').forEach(s => s.classList.remove('drag-active'));
        document.querySelectorAll('.kanban-drop-zone-active').forEach(z => z.classList.remove('kanban-drop-zone-active'));
    }

    onDragOverDay(e) {
        if (e.target.closest('.kanban-drop-slot')) return;
        if (e.target.closest('.kanban-day-drop-start')) return;
        if (e.target.closest('.kanban-day-drop-end')) return;
        if (e.target.closest('.kanban-task')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const day = e.target.closest('.kanban-day');
        if (day) day.classList.add('drag-over');
    }

    onDragLeaveDay(e) {
        const day = e.target.closest('.kanban-day');
        if (day && !day.contains(e.relatedTarget)) {
            day.classList.remove('drag-over');
        }
    }

    onDragOverDayStart(e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('kanban-drop-zone-active');
        const day = e.currentTarget.closest('.kanban-day');
        if (day) day.classList.remove('drag-over');
    }

    onDragLeaveDayStart(e) {
        if (!e.currentTarget.contains(e.relatedTarget)) {
            e.currentTarget.classList.remove('kanban-drop-zone-active');
        }
    }

    async onDropDayStart(e, dateStr, firstTaskId) {
        e.preventDefault();
        e.stopPropagation();
        e.currentTarget.classList.remove('kanban-drop-zone-active');
        const day = e.currentTarget.closest('.kanban-day');
        if (day) day.classList.remove('drag-over');
        document.querySelectorAll('.kanban-drop-slot.drag-active').forEach(s => s.classList.remove('drag-active'));
        await this.applyKanbanReorder(dateStr, firstTaskId);
    }

    onDragOverDayEnd(e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('kanban-drop-zone-active');
        const day = e.currentTarget.closest('.kanban-day');
        if (day) day.classList.remove('drag-over');
    }

    onDragLeaveDayEnd(e) {
        if (!e.currentTarget.contains(e.relatedTarget)) {
            e.currentTarget.classList.remove('kanban-drop-zone-active');
        }
    }

    async onDropDayEnd(e, dateStr) {
        e.preventDefault();
        e.stopPropagation();
        e.currentTarget.classList.remove('kanban-drop-zone-active');
        const day = e.currentTarget.closest('.kanban-day');
        if (day) day.classList.remove('drag-over');
        document.querySelectorAll('.kanban-drop-slot.drag-active').forEach(s => s.classList.remove('drag-active'));
        await this.applyKanbanReorder(dateStr, '');
    }

    onSlotDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        e.currentTarget.classList.add('drag-active');
    }

    onSlotDragLeave(e) {
        if (!e.currentTarget.contains(e.relatedTarget)) {
            e.currentTarget.classList.remove('drag-active');
        }
    }

    async onSlotDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        e.currentTarget.classList.remove('drag-active');
        const slot = e.currentTarget;
        const dateStr = slot.dataset.date;
        const beforeRaw = slot.dataset.beforeId || '';
        const day = slot.closest('.kanban-day');
        if (day) day.classList.remove('drag-over');
        await this.applyKanbanReorder(dateStr, beforeRaw);
    }

    async onDropDay(e, dateStr) {
        if (e.target.closest('.kanban-drop-slot')) return;
        if (e.target.closest('.kanban-task')) return;
        e.preventDefault();
        e.stopPropagation();
        const day = e.target.closest('.kanban-day');
        if (day) day.classList.remove('drag-over');
        await this.applyKanbanReorder(dateStr, '');
    }

    mergeOrdersFromResponse(dateStr, orders) {
        orders.forEach(({ id, order }) => {
            const ev = this.events.find(x => x.id === id);
            if (ev) {
                ev.start = dateStr;
                ev.order = order;
            }
        });
    }

    async applyKanbanReorder(dateStr, beforeId) {
        const taskId = this.draggedTask;
        if (!taskId) return;
        if (beforeId !== '' && parseInt(beforeId, 10) === Number(taskId)) return;

        const prev = this.events.find(ev => ev.id === taskId);
        const prevDate = prev ? prev.start : null;

        const body = new URLSearchParams({ due_date: dateStr });
        if (beforeId) body.set('before_id', beforeId);

        try {
            const data = await apiFetch(`/tasks/${taskId}/kanban-reorder/`, {
                method: 'POST',
                body: body.toString(),
            });
            if (this.isStale()) return;
            if (data.success && data.orders) {
                this.mergeOrdersFromResponse(data.due_date, data.orders);
                this.render();
                if (prevDate !== data.due_date) {
                    showToast('Задача перемещена');
                } else {
                    showToast('Порядок обновлён', 'info', 1800);
                }
            } else {
                showToast('Не удалось сохранить', 'error');
                this.reload();
            }
        } catch (err) {
            showToast('Ошибка при перемещении', 'error');
            this.reload();
        }
    }

    async toggleTaskFromKanban(taskId) {
        try {
            const data = await apiFetch(`/tasks/${taskId}/toggle/`, { method: 'POST' });
            if (data.success) {
                const evt = this.events.find(ev => ev.id === taskId);
                if (evt) evt.completed = data.is_completed;
                this.render();
                showToast(data.is_completed ? 'Задача завершена! ✓' : 'Задача возвращена', data.is_completed ? 'success' : 'info');
                refreshSidebar();
            }
        } catch (err) {
            showToast('Ошибка', 'error');
        }
    }

    /** Показать в каждом дне все задачи, а не первые четыре. */
    expandAll() {
        document.querySelectorAll('.cal-cell').forEach(cell => {
            cell.classList.add('expanded');
            const more = cell.querySelector('.cal-more');
            if (more) more.textContent = 'свернуть';
        });
    }

    collapseAll() {
        document.querySelectorAll('.cal-cell').forEach(cell => {
            cell.classList.remove('expanded');
            const more = cell.querySelector('.cal-more');
            if (more) more.textContent = `ещё ${cell.querySelectorAll('.cal-item.extra').length}`;
        });
    }

    /** Подсветить активный режим и спрятать то, что в нём не нужно. */
    syncViewChrome() {
        const root = document.getElementById('kanbanCalendarRoot');
        if (root) root.classList.toggle('week-mode', this.viewMode === 'week');

        const monthBtn = document.getElementById('kanbanViewMonthBtn');
        const weekBtn = document.getElementById('kanbanViewWeekBtn');
        if (monthBtn) monthBtn.classList.toggle('active', this.viewMode === 'month');
        if (weekBtn) weekBtn.classList.toggle('active', this.viewMode === 'week');

        // «Раскрыть все / Свернуть» относятся к дням месяца — в неделе их нет.
        const expand = document.getElementById('kanbanExpandActions');
        if (expand) expand.hidden = this.viewMode === 'week';

        const prev = document.getElementById('kanbanPrevBtn');
        const next = document.getElementById('kanbanNextBtn');
        const unit = this.viewMode === 'week' ? 'неделя' : 'месяц';
        if (prev) prev.title = unit === 'неделя' ? 'Предыдущая неделя' : 'Предыдущий месяц';
        if (next) next.title = unit === 'неделя' ? 'Следующая неделя' : 'Следующий месяц';
    }

    setViewMode(mode) {
        const next = mode === 'week' ? 'week' : 'month';
        if (next === this.viewMode) return;
        this.viewMode = next;
        try {
            localStorage.setItem('scopeCalendarView', next);
        } catch (e) { /* приватный режим — просто не запоминаем */ }
        this.expandedWeeks.clear();
        void this.init(next === 'month' ? 'instant' : undefined);
    }

    prev() {
        if (this.viewMode === 'week') {
            this.currentDate.setDate(this.currentDate.getDate() - 7);
        } else {
            this.currentDate.setMonth(this.currentDate.getMonth() - 1);
        }
        this.expandedWeeks.clear();
        void this.init();
    }

    next() {
        if (this.viewMode === 'week') {
            this.currentDate.setDate(this.currentDate.getDate() + 7);
        } else {
            this.currentDate.setMonth(this.currentDate.getMonth() + 1);
        }
        this.expandedWeeks.clear();
        void this.init();
    }

    prevMonth() {
        this.prev();
    }

    nextMonth() {
        this.next();
    }

    goToToday() {
        this.currentDate = new Date();
        this.expandedWeeks.clear();
        void this.init('smooth');
    }

    async reload() {
        if (this.isStale()) return;
        await this.loadEvents();
        if (this.isStale()) return;
        this.render();
    }

    escapeHtml(text) {
        if (!text) return '';
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    pluralize(n, one, few, many) {
        const m10 = n % 10, m100 = n % 100;
        if (m100 >= 11 && m100 <= 19) return many;
        if (m10 === 1) return one;
        if (m10 >= 2 && m10 <= 4) return few;
        return many;
    }
}

window.kanbanCalendar = new KanbanCalendar();
})();
</script>
{% endblock %}
